<article
  class="flex w-full max-w-xs flex-col rounded-2xl border border-amber-100 bg-white p-5 shadow-sm transition-shadow hover:shadow-md"
>
  <div class="flex h-40 items-center justify-center overflow-hidden rounded-xl bg-amber-50">
  <img
    [src]="producto().imgUrl"
    [alt]="producto().nombre"
    class="h-full w-full object-cover"
  />
</div>

  <span
    class="mt-4 self-start rounded-full border border-amber-200 bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-800"
  >
    {{ producto().categoria.nombre }}
  </span>

  <h3 class="mt-3 text-lg font-semibold text-gray-900">{{ producto().nombre }}</h3>
  <p class="mt-1 flex-1 text-sm text-gray-500">{{ producto().descripcion }}</p>

  <div class="mt-5 flex items-center justify-between gap-3">
    <span class="text-2xl font-extrabold text-gray-900">
      {{ producto().precio | currency: 'USD' : 'symbol' : '1.2-2' }}
    </span>

    <button
      type="button"
      (click)="agregar.emit(producto())"
      [disabled]="!producto().disponible"
      class="rounded-lg bg-amber-700 px-3 py-2 text-sm font-medium text-white hover:bg-amber-800 disabled:cursor-not-allowed disabled:bg-gray-300"
    >
      {{ producto().disponible ? 'Agregar' : 'Agotado' }}
    </button>
  </div>
</article>
