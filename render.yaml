services:
  - type: web
    name: cafeteria-aroma
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/estado
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cafeteria-db
          property: connectionString

databases:
  - name: cafeteria-db
    plan: free
    region: oregon
    databaseName: cafeteria
    user: cafeteria
